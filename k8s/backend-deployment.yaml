apiVersion: v1
kind: Namespace
metadata:
  name: barodago
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: barodago-config
  namespace: barodago
data:
  DATABASE_URL: "postgresql://barodago_user:password@postgres:5432/barodago"
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://barodago:password@rabbitmq:5672/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: barodago
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/ankitgpt18/barodago:latest-backend
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: barodago-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: barodago-config
              key: REDIS_URL
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: barodago-secrets
              key: google-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: barodago
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: barodago
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
