version: '3.8'

services:
  # 1. BarodaGo Civic Operating Engine API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: barodago-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vmc_admin:vmc_secure_pwd@postgres:5432/barodago_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - barodago-network

  # 2. PostgreSQL 16 with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: barodago-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: barodago_db
      POSTGRES_USER: vmc_admin
      POSTGRES_PASSWORD: vmc_secure_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmc_admin -d barodago_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barodago-network

  # 3. Redis 7 for Sliding-Window Rate Limiting & Spatial Cache
  redis:
    image: redis:7-alpine
    container_name: barodago-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barodago-network

  # 4. Prometheus Observability & Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: barodago-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./server/src/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    networks:
      - barodago-network

networks:
  barodago-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
